<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 | 이비인후과 건강 가이드 모음</title>
  <meta name="description" content="요청하신 페이지를 찾을 수 없습니다. 이비인후과 건강 가이드 모음에서 원하는 자료를 검색해 보세요.">
  <meta name="robots" content="noindex">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="페이지를 찾을 수 없습니다">
  <meta property="og:description" content="이비인후과 건강 가이드 모음에서 원하는 자료를 검색해 보세요.">
  <meta name="theme-color" content="#1F5FA8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 404는 하위 경로에서도 열리므로 절대 경로 사용 -->
  <link rel="stylesheet" href="/ent-diseases-guide/assets/kyp-theme.css">
  <script>
    // 옛 주소 호환: 확장자 없던 /schogren → sjogren.html
    (function () {
      var p = location.pathname.replace(/\/+$/, '');
      if (/\/schogren$/i.test(p)) location.replace(p.replace(/schogren$/i, 'sjogren.html'));
    })();
  </script>
  <style>
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px 0; }
    .kyp-card { max-width: 560px; }
    .code { font-size: 56px; font-weight: 800; color: var(--kyp-accent); margin: 0; line-height: 1; }
    h1 { font-size: 24px; margin: 12px 0; }
    p { color: var(--kyp-text-muted); }
    form { display: grid; gap: 8px; margin: 16px 0; }
    label { font-weight: 600; color: var(--kyp-text); }
    .row { display: flex; gap: 8px; }
    .row .kyp-input { flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <main class="kyp-container">
    <div class="kyp-card">
      <p class="code" aria-hidden="true">404</p>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 바뀌었거나 삭제된 페이지일 수 있습니다. 찾으시는 내용을 검색해 보세요.</p>
      <form action="/ent-diseases-guide/" method="get" role="search">
        <label for="q">가이드 검색</label>
        <div class="row">
          <input id="q" name="q" class="kyp-input" type="search" placeholder="예: 기면증, 쇼그렌">
          <button class="kyp-btn" type="submit">검색</button>
        </div>
      </form>
      <a class="kyp-btn kyp-btn--ghost" href="/ent-diseases-guide/">← 가이드 모음 첫 화면</a>
    </div>
  </main>
</body>
</html>
